name: Publish to PSGallery

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSResourceGet (if not present)
        run: |
          pwsh -Command "if (-not (Get-Module -ListAvailable Microsoft.PowerShell.PSResourceGet)) { Install-Module Microsoft.PowerShell.PSResourceGet -Force -Scope AllUsers }"

      - name: Publish module to PSGallery and create release artifact
        run: pwsh ./build.ps1 publish
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}

      - name: Publish module to GitHub Packages
        run: pwsh ./build.ps1 publish_ghp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: output/N2C.GuacAdmin-*.zip
          fail_on_unmatched_files: true
