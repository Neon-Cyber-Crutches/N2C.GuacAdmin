---
# N2C.GuacAdmin build configuration
# Parsed by build.ps1 using the powershell-yaml module.

# Build dependencies saved to output/RequiredModules to avoid
# conflicts with locally installed module versions.
#
# NOTE: build.ps1 also bootstraps its own internal dependencies before loading
# this file (powershell-yaml for YAML parsing, InvokeBuild as the task runner).
# Those are defined in build.ps1 itself and cannot be listed here.
RequiredModules:
  Pester: '5.7.1'
  PSScriptAnalyzer: '1.25.0'
  Microsoft.PowerShell.PSResourceGet: '1.2.0'

# Paths (relative to repository root)
ModuleSource: src/N2C.GuacAdmin

# Test configuration
Tests:
  UnitFiles:
    - src/N2C.GuacAdmin/Tests/Helpers.Tests.ps1
  IntegrationFiles:
    - src/N2C.GuacAdmin/Tests/ActiveSessions.Tests.ps1
    - src/N2C.GuacAdmin/Tests/ConnectionGroups.Tests.ps1
    - src/N2C.GuacAdmin/Tests/Connections.Tests.ps1
    - src/N2C.GuacAdmin/Tests/DataSource.Tests.ps1
    - src/N2C.GuacAdmin/Tests/HistorySchema.Tests.ps1
    - src/N2C.GuacAdmin/Tests/Permissions.Tests.ps1
    - src/N2C.GuacAdmin/Tests/SessionLifecycle.Tests.ps1
    - src/N2C.GuacAdmin/Tests/SharingProfiles.Tests.ps1
    - src/N2C.GuacAdmin/Tests/UserGroups.Tests.ps1
    - src/N2C.GuacAdmin/Tests/Users.Tests.ps1
  Verbosity: Detailed

# Lint configuration
Lint:
  SettingsFile: src/N2C.GuacAdmin/PSScriptAnalyzerSettings.psd1
  Severity:
    - Warning
    - Error

# Publish configuration
Publish:
  Repository: PSGallery
  # API key is resolved in this priority order:
  #   1. -ApiKey parameter (CLI override)
  #   2. .psgallerykey file in repo root (local development)
  #   3. PSGALLERY_API_KEY environment variable (CI)
  ApiKeyFile: .psgallerykey

# Pack configuration
Pack:
  ArtifactName: N2C.GuacAdmin
  # Files and directories (relative to ModuleSource) to include in the release artifact.
  # All other files (tests, dev tooling, docs) are excluded.
  Include:
    - N2C.GuacAdmin.psd1
    - N2C.GuacAdmin.psm1
    - N2C.GuacAdmin.Format.ps1xml
    - Types.ps1
    - Public
    - Private
# Build workflow definitions (Invoke-Build task sequences)
BuildWorkflow:
  '.':
    - test
    - lint
  test:
    - test_unit
    - test_integration
  lint:
    - lint_module
  publish_dry_run:
    - test
    - lint
    - publish_validate
  publish:
    - publish_dry_run
    - pack
    - publish_module
  publish_ghp:
    - publish_validate
